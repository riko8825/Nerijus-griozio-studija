<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Akva Studio — Mobile Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .info {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .controls button:hover { background: #3a3a3a; }
    .controls button.active {
      background: #B07D6A;
      border-color: #B07D6A;
    }
    .phone {
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }
    .phone iframe {
      border: 0;
      border-radius: 28px;
      display: block;
      background: #fff;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #666;
    }
    .footer a {
      color: #B07D6A;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Akva Studio — Mobile Preview</h1>
  <p class="info" id="size-label">iPhone 14 Pro · 390 × 844</p>

  <div class="controls">
    <button data-w="360" data-h="800">Android (360)</button>
    <button data-w="390" data-h="844" class="active">iPhone 14 Pro (390)</button>
    <button data-w="412" data-h="915">Pixel 7 (412)</button>
    <button data-w="430" data-h="932">iPhone 15 Pro Max (430)</button>
    <button data-w="768" data-h="1024">iPad (768)</button>
  </div>

  <div class="phone" id="phone">
    <iframe id="preview" src="index.html" width="390" height="844"></iframe>
  </div>

  <p class="footer">
    Reload: <a href="javascript:document.getElementById('preview').contentWindow.location.reload()">↻ atnaujinti</a>
    &nbsp;·&nbsp;
    <a href="index.html" target="_blank">atidaryti pilną</a>
  </p>

  <script>
    const buttons = document.querySelectorAll('.controls button');
    const iframe = document.getElementById('preview');
    const label = document.getElementById('size-label');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const w = btn.dataset.w;
        const h = btn.dataset.h;
        iframe.width = w;
        iframe.height = h;
        label.textContent = `${btn.textContent.trim()} · ${w} × ${h}`;
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
